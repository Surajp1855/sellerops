    <!-- =====================================================================
         3. THEME BOOTSTRAP  -  turns CONFIG into CSS variables and picks the
         theme before first paint (no flash). Nothing to edit here.
         ===================================================================== -->
    <script>
      (function () {
        const C = CONFIG, T = C.theme, S = C.site, root = document.documentElement;
        const kebab = (k) => k.replace(/[A-Z]/g, (m) => "-" + m.toLowerCase());
        const vars = (o) => Object.entries(o).map(([k, v]) => "--" + kebab(k) + ":" + v).join(";");
        const heroImg = C.hero.bgImage ? 'url("' + C.hero.bgImage + '")' : "none";
        const bp = C.breakpoints.mobile;

        const css =
          ":root{color-scheme:light;" + vars(T.shared) + ";" + vars(T.light) + ";" +
          vars(T.fonts) + ";" + vars(T.layout) + ";--hero-image:" + heroImg + "}" +
          ':root[data-theme="dark"]{color-scheme:dark;' + vars(T.dark) + "}" +
          "@media (max-width:" + bp + "px){" +
          ".menu-btn{display:block;order:3;margin-left:10px}" +
          ".theme-btn{order:2;margin-left:auto}" +
          ".main-nav{display:none;position:absolute;top:100%;left:0;right:0;margin-left:0;background:var(--ink);flex-direction:column;align-items:stretch;padding:20px var(--gutter);gap:16px;border-bottom:1px solid var(--line)}" +
          ".main-nav.open{display:flex}" +
          ".main-nav>a.nav-cta{text-align:center}" +
          ".has-mega{width:100%}" +
          ".mega{position:static;padding:16px 0 0;background:none;border:0;box-shadow:none}" +
          ".slides{background-size:auto 55%;background-position:right bottom}" +
          ".slide-in{grid-template-columns:1fr;gap:26px;padding-top:40px;padding-bottom:30px}" +
          "}";
        const style = document.createElement("style");
        style.id = "config-theme";
        style.textContent = css; /* appended after the static <style>, so mobile rules win */
        document.head.appendChild(style);

        if (T.fontsUrl) {
          const l = document.createElement("link");
          l.rel = "stylesheet";
          l.href = T.fontsUrl;
          document.head.appendChild(l);
        }

        const meta = (name, content) => {
          let m = document.querySelector('meta[name="' + name + '"]');
          if (!m) { m = document.createElement("meta"); m.name = name; document.head.appendChild(m); }
          m.content = content;
        };
        root.lang = S.lang;
        document.title = S.title;
        meta("description", S.description);

        window.setTheme = function (t) {
          root.setAttribute("data-theme", t);
          meta("theme-color", T[t].themeColor);
        };
        let saved = null;
        try { saved = localStorage.getItem(S.storageKey); } catch (e) {}
        const sys = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        window.setTheme(saved === "light" || saved === "dark" ? saved : sys);
      })();
    </script>

    <!-- =====================================================================

    <script>
      (function () {
        const C = CONFIG, S = C.site, K = C.contact, U = C.ui, TM = C.timings;
        const $ = (s, r = document) => r.querySelector(s);
        const $$ = (s, r = document) => [...r.querySelectorAll(s)];

        /* ---------- helpers ---------- */
        const tokens = {
          brand: S.name + " " + S.nameAccent,
          email: K.email,
          phone: K.phone,
          phoneLabel: K.phoneLabel,
          office: K.office,
          year: S.year,
          domain: S.domain,
        };
        const esc = (v) =>
          String(v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        const kebab = (k) => k.replace(/[A-Z]/g, (m) => "-" + m.toLowerCase());
        const fmt = (s) => String(s).replace(/\{(\w+)\}/g, (m, k) => (k in tokens ? tokens[k] : m));
        const t = (s) => esc(fmt(s));
        const link = (l, cls) => `<a href="${t(l.href)}"${cls ? ` class="${cls}"` : ""}>${t(l.label)}</a>`;
        const sec = (cfg, cls, inner) =>
          `<section${cfg.id ? ` id="${esc(cfg.id)}"` : ""} class="section${cls ? " " + cls : ""}">${inner}</section>`;
        const initials = (label) =>
          label.split(/\W+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join("").toUpperCase();

        /* ---------- parts ---------- */
        const topbar = () =>
          `<div class="topbar"><div class="wrap topbar-in">${C.topbar.items.map((i) => `<span>${t(i)}</span>`).join("")}${link(C.topbar.link, "topbar-link")}</div></div>`;

        const navItem = (n) => {
          if (n.columns) {
            const cols = n.columns
              .map((c) => `<div class="mega-col"><h4>${t(c.title)}</h4>${c.links.map((l) => link(l)).join("")}</div>`)
              .join("");
            return `<div class="has-mega"><button class="mega-trigger" aria-expanded="false">${t(n.label)}</button><div class="mega">${cols}</div></div>`;
          }
          return link(n, n.cta ? "btn btn-gold nav-cta" : "");
        };

        const svg = (cls, inner) =>
          `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${inner}</svg>`;

        const header = () =>
          `<header class="site-header"><div class="wrap nav">
            <a href="#top" class="logo">${t(S.name)} <span>${t(S.nameAccent)}</span></a>
            <button class="menu-btn" id="menuBtn" aria-label="${t(U.menuAria)}" aria-expanded="false">${t(U.menu)}</button>
            <nav class="main-nav" id="mainNav">${C.nav.map(navItem).join("")}</nav>
            <button class="theme-btn${U.themeToggle.showLabel ? " has-label" : ""}" id="themeBtn" type="button">${svg("moon", U.icons.moon)}${svg("sun", U.icons.sun)}${U.themeToggle.showLabel ? '<span class="theme-label"></span>' : ""}</button>
          </div></header>`;

        const R = {
          hero() {
            const H = C.hero;
            const slide = (s, i) =>
              `<div class="slide${i ? "" : " active"}"><div class="wrap slide-in"><div class="slide-text"><h1>${t(s.title)}</h1><p>${t(s.text)}</p>${link(s.cta, "btn btn-gold")}</div>${s.image ? `<img class="slide-img" src="${esc(s.image.src)}" alt="${esc(s.image.alt || "")}" ${i ? 'loading="lazy"' : ""} />` : ""}</div></div>`;
            return `<section class="hero" id="${esc(H.id)}"><div class="slides">${H.slides.map(slide).join("")}</div>
              <div class="wrap hero-ctrl"><button id="prevSlide" aria-label="${t(U.prevSlide)}">${esc(U.prevIcon)}</button><div class="dots" id="dots"></div><button id="nextSlide" aria-label="${t(U.nextSlide)}">${esc(U.nextIcon)}</button></div></section>`;
          },

          stats() {
            return `<section class="stats"><div class="wrap stats-grid">${C.stats
              .map((s) => `<div><b><span data-count="${esc(s.value)}">0</span>${t(s.suffix || "")}</b><span class="stat-label">${t(s.label)}</span></div>`)
              .join("")}</div></section>`;
          },

          about() {
            const A = C.about;
            return sec(A, "", `<div class="wrap two-col"><div><h2>${t(A.title)}</h2><p>${t(A.text)}</p>
              <ul class="ticks">${A.points.map((p) => `<li>${t(p)}</li>`).join("")}</ul></div>
              <img class="about-img" src="${t(A.image.src)}" alt="${t(A.image.alt)}" data-onerror="hide" /></div>`);
          },

          services() {
            const V = C.services;
            return sec(V, "alt", `<div class="wrap"><h2>${t(V.title)}</h2><p class="lead">${t(V.lead)}</p>
              <div class="tabs" role="tablist">${V.tabs
                .map((b, i) => `<button class="tab${i ? "" : " active"}" data-tab="${esc(b.key)}">${t(b.label)}</button>`)
                .join("")}</div>
              <div class="cards" id="serviceCards">${V.cards
                .map((c) => `<article class="card" data-p="${esc(c.platforms.join(" "))}"><h3>${t(c.title)}</h3><p>${t(c.text)}</p></article>`)
                .join("")}</div></div>`);
          },

          packages() {
            const P = C.packages;
            const plan = (p) =>
              `<div class="plan${p.featured ? " featured" : ""}">${p.featured ? `<span class="badge">${t(P.badge)}</span>` : ""}
                <h3>${t(p.name)}</h3>
                <div class="price">${t(P.currency)} ${t(p.amount)}${p.period ? ` <small>${t(p.period)}</small>` : ""}</div>
                <ul>${p.features.map((f) => `<li>${t(f)}</li>`).join("")}</ul>
                ${link(P.cta, "btn " + (p.featured ? "btn-gold" : "btn-line"))}</div>`;
            return sec(P, "", `<div class="wrap"><h2>${t(P.title)}</h2><p class="lead">${t(P.lead)}</p><div class="plans">${P.plans.map(plan).join("")}</div></div>`);
          },

          process() {
            const P = C.process;
            return sec(P, "alt", `<div class="wrap"><h2>${t(P.title)}</h2><ol class="steps">${P.steps
              .map((s, i) => `<li><span class="step-no">${t(U.stepLabel)} ${i + 1}</span><h3>${t(s.title)}</h3><p>${t(s.text)}</p></li>`)
              .join("")}</ol></div>`);
          },

          industries() {
            const I = C.industries;
            const item = (x) =>
              `<div class="ind"><i>${x.icon ? `<img src="${t(x.icon)}" alt="" width="24" height="24" data-initials="${esc(initials(x.label))}" />` : esc(initials(x.label))}</i><span>${t(x.label)}</span></div>`;
            return sec(I, "", `<div class="wrap"><h2>${t(I.title)}</h2><p class="lead">${t(I.lead)}</p><div class="ind-grid">${I.items.map(item).join("")}</div></div>`);
          },

          pie() {
            const P = C.pie;
            const total = P.slices.reduce((a, s) => a + s.value, 0);
            const c = 100, r = 96, ri = r * P.hole;
            const pt = (rad, a) => [c + rad * Math.cos(a), c + rad * Math.sin(a)];
            let a0 = -Math.PI / 2;
            const items = P.slices.map((s) => ({ ...s, frac: s.value / total, pct: Math.round((s.value / total) * 100) }));
            const paths = items.map((s, i) => {
              const a1 = a0 + s.frac * 2 * Math.PI;
              let d;
              if (s.frac >= 0.9999) {
                const circle = (rad) => `M${c - rad} ${c}a${rad} ${rad} 0 1 0 ${2 * rad} 0a${rad} ${rad} 0 1 0 ${-2 * rad} 0Z`;
                d = circle(r) + (ri ? circle(ri) : "");
              } else {
                const [x0, y0] = pt(r, a0), [x1, y1] = pt(r, a1), large = s.frac > 0.5 ? 1 : 0;
                if (ri) {
                  const [xi1, yi1] = pt(ri, a1), [xi0, yi0] = pt(ri, a0);
                  d = `M${x0} ${y0}A${r} ${r} 0 ${large} 1 ${x1} ${y1}L${xi1} ${yi1}A${ri} ${ri} 0 ${large} 0 ${xi0} ${yi0}Z`;
                } else {
                  d = `M${c} ${c}L${x0} ${y0}A${r} ${r} 0 ${large} 1 ${x1} ${y1}Z`;
                }
              }
              a0 = a1;
              return `<path class="pie-slice" data-i="${i}" d="${d}" fill="var(--${kebab(s.color)})" fill-rule="evenodd"><title>${t(s.label)}: ${s.pct}%</title></path>`;
            }).join("");
            const summary = items.map((s) => `${fmt(s.label)} ${s.pct}%`).join(", ");
            const legend = items.map((s, i) =>
              `<li data-i="${i}" tabindex="0"><span class="swatch" style="background:var(--${kebab(s.color)})"></span><span class="pie-name">${t(s.label)}</span><span class="pie-pct">${s.pct}%</span></li>`).join("");
            return sec(P, P.alt ? "alt" : "", `<div class="wrap"><h2>${t(P.title)}</h2><p class="lead">${t(P.lead)}</p>
              <div class="pie-wrap"><svg class="pie" viewBox="0 0 200 200" role="img" aria-label="${esc(fmt(P.title) + ": " + summary)}">${paths}</svg>
              <ul class="pie-legend">${legend}</ul></div></div>`);
          },

          testimonials() {
            const Q = C.testimonials;
            const stars = (n) =>
              n > 0
                ? `<div class="client-stars" role="img" aria-label="${esc(Q.ratingLabel.replace("{rating}", n).replace("{max}", Q.ratingMax))}">${esc(Q.star.repeat(n) + Q.starEmpty.repeat(Math.max(Q.ratingMax - n, 0)))}</div>`
                : "";
            const card = (c) =>
              `<article class="client"><div class="client-top"><i class="client-av">${esc(initials(fmt(c.name)))}</i><div><h3>${t(c.name)}</h3><span class="client-id">${t(Q.idLabel)} ${t(c.id)}</span></div></div>${stars(c.rating || 0)}${c.quote ? `<p class="client-quote">${esc(Q.open)}${t(c.quote)}${esc(Q.close)}</p>` : ""}</article>`;
            return sec(Q, "alt", `<div class="wrap"><h2>${t(Q.title)}</h2><div class="client-grid">${Q.items.map(card).join("")}</div></div>`);
          },

          cases() {
            const X = C.cases;
            const item = (c) =>
              `<a class="case" href="${t(c.href)}"><div class="case-img"><img src="${t(c.image)}" alt="" data-onerror="hide" /></div><small>${t(c.platform)}</small><h3>${t(c.title)}</h3><p>${t(c.text)}</p></a>`;
            return sec(X, "", `<div class="wrap"><div class="head-row"><h2>${t(X.title)}</h2>${link(X.viewAll, "btn btn-line")}</div><div class="case-grid">${X.items.map(item).join("")}</div></div>`);
          },

          faq() {
            const F = C.faq;
            return sec(F, "", `<div class="wrap narrow"><h2>${t(F.title)}</h2><div class="faq">${F.items
              .map((f, i) => `<div class="faq-item"><button class="faq-q" aria-expanded="false" aria-controls="faq-a-${i}">${t(f.q)}</button><div class="faq-a" id="faq-a-${i}"><p>${t(f.a)}</p></div></div>`)
              .join("")}</div></div>`);
          },

          contact() {
            const X = C.contactSection, F = X.form;
            const field = (f) => {
              let ctl;
              if (f.type === "select")
                ctl = `<select name="${esc(f.name)}">${f.options.map((o) => `<option>${t(o)}</option>`).join("")}</select>`;
              else if (f.type === "textarea")
                ctl = `<textarea name="${esc(f.name)}" rows="${esc(f.rows || 4)}"></textarea>`;
              else ctl = `<input type="${esc(f.type)}" name="${esc(f.name)}"${f.required ? " required" : ""} />`;
              return `<label>${t(f.label)}${ctl}</label>`;
            };
            return sec(X, "alt", `<div class="wrap two-col"><div><h2>${t(X.title)}</h2><p>${t(X.reply)}</p><p>${X.lines.map((l) => t(l)).join("<br />")}</p></div>
              <form id="contactForm" class="form" novalidate>${F.fields.map(field).join("")}${F.honeypot ? `<input class="hp" type="text" name="${esc(F.honeypot)}" tabindex="-1" autocomplete="off" aria-hidden="true" />` : ""}
              <button type="submit" class="btn btn-gold">${t(F.submit)}</button><p class="form-msg" id="formMsg" role="status"></p></form></div>`);
          },

          offices() {
            const O = C.offices;
            return sec(O, "alt", `<div class="wrap"><h2>${t(O.title)}</h2><div class="off-grid">${O.items
              .map((o) => `<div class="off"><h3>${t(o.city)}</h3><p>${t(o.address)}</p><p>${t(o.phone)}</p></div>`)
              .join("")}</div></div>`);
          },
        };

        const footer = () => {
          const F = C.footer;
          return `<footer class="footer"><div class="wrap foot-grid">
            <div><a href="#top" class="logo">${t(S.name)} <span>${t(S.nameAccent)}</span></a><p>${t(F.tagline)}</p></div>
            ${F.columns.map((c) => `<div><h4>${t(c.title)}</h4>${c.links.map((l) => link(l)).join("")}</div>`).join("")}
          </div><div class="wrap foot-bottom"><span>${t(F.copyright)}</span><span>${t(F.right)}</span></div></footer>`;
        };

        /* ---------- render ---------- */
        $("#app").innerHTML =
          topbar() + header() + `<main id="top">${C.order.map((k) => R[k]()).join("")}</main>` + footer();

        /* images that fail to load: hide them, or show initials for icons */
        $$("img[data-onerror], img[data-initials]").forEach((img) => {
          const fail = () => {
            if (img.dataset.initials) img.parentElement.textContent = img.dataset.initials;
            else img.remove();
          };
          img.addEventListener("error", fail);
          if (img.complete && !img.naturalWidth) fail();
        });

        /* ---------- theme toggle ---------- */
        const root = document.documentElement, themeBtn = $("#themeBtn");
        const sysDark = matchMedia("(prefers-color-scheme: dark)");
        const stored = () => { try { return localStorage.getItem(S.storageKey); } catch (e) { return null; } };
        function applyTheme(th) {
          window.setTheme(th);
          const msgTxt = th === "dark" ? U.toLight : U.toDark;
          themeBtn.setAttribute("aria-label", msgTxt);
          themeBtn.setAttribute("title", msgTxt);
          const lbl = $(".theme-label", themeBtn);
          if (lbl) lbl.textContent = th === "dark" ? U.themeToggle.labelToLight : U.themeToggle.labelToDark;
        }
        applyTheme(root.getAttribute("data-theme"));
        themeBtn.addEventListener("click", () => {
          const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
          applyTheme(next);
          try { localStorage.setItem(S.storageKey, next); } catch (e) {}
        });
        sysDark.addEventListener("change", (e) => { if (!stored()) applyTheme(e.matches ? "dark" : "light"); });

        /* ---------- mobile menu + mega menus ---------- */
        const menuBtn = $("#menuBtn"), nav = $("#mainNav"), megas = $$(".has-mega");
        menuBtn.addEventListener("click", () => {
          const open = nav.classList.toggle("open");
          menuBtn.setAttribute("aria-expanded", open);
        });
        const setMega = (m, open) => {
          m.classList.toggle("open", open);
          $(".mega-trigger", m).setAttribute("aria-expanded", open);
        };
        megas.forEach((m) =>
          $(".mega-trigger", m).addEventListener("click", (e) => {
            e.stopPropagation();
            const willOpen = !m.classList.contains("open");
            megas.forEach((x) => setMega(x, false));
            setMega(m, willOpen);
          })
        );
        document.addEventListener("click", (e) => megas.forEach((m) => { if (!m.contains(e.target)) setMega(m, false); }));
        $$(".mega a, .main-nav > a").forEach((a) =>
          a.addEventListener("click", () => { megas.forEach((m) => setMega(m, false)); nav.classList.remove("open"); menuBtn.setAttribute("aria-expanded", false); })
        );
        document.addEventListener("keydown", (e) => { if (e.key === "Escape") megas.forEach((m) => setMega(m, false)); });

        /* ---------- hero slider ---------- */
        const slides = $$(".slide"), dotsBox = $("#dots");
        let cur = 0, timer;
        slides.forEach((_, i) => {
          const d = document.createElement("button");
          d.className = "dot" + (i === 0 ? " active" : "");
          d.setAttribute("aria-label", U.goToSlide.replace("{n}", i + 1));
          d.addEventListener("click", () => { go(i); restart(); });
          dotsBox.appendChild(d);
        });
        const dots = $$(".dot");
        function go(n) {
          cur = (n + slides.length) % slides.length;
          slides.forEach((s, i) => s.classList.toggle("active", i === cur));
          dots.forEach((d, i) => d.classList.toggle("active", i === cur));
        }
        function restart() { clearInterval(timer); timer = setInterval(() => go(cur + 1), TM.heroMs); }
        $("#prevSlide").addEventListener("click", () => { go(cur - 1); restart(); });
        $("#nextSlide").addEventListener("click", () => { go(cur + 1); restart(); });
        restart();

        /* ---------- count-up stats ---------- */
        const io = new IntersectionObserver((entries) => {
          entries.forEach((en) => {
            if (!en.isIntersecting) return;
            const el = en.target, end = +el.dataset.count, t0 = performance.now();
            (function tick(now) {
              const p = Math.min((now - t0) / TM.countMs, 1);
              el.textContent = Math.round(end * p);
              if (p < 1) requestAnimationFrame(tick);
            })(t0);
            io.unobserve(el);
          });
        }, { threshold: TM.countThreshold });
        $$("[data-count]").forEach((c) => io.observe(c));

        /* ---------- service tabs ---------- */
        $$(".tab").forEach((tab) =>
          tab.addEventListener("click", () => {
            $$(".tab").forEach((x) => x.classList.remove("active"));
            tab.classList.add("active");
            const f = tab.dataset.tab;
            $$("#serviceCards .card").forEach((c) =>
              c.classList.toggle("hide", f !== C.services.allKey && !c.dataset.p.split(" ").includes(f))
            );
          })
        );

        /* ---------- pie chart hover / focus highlight ---------- */
        const pieSvg = $(".pie");
        if (pieSvg) {
          const marks = $$(".pie-slice, .pie-legend li");
          const light = (i) => {
            pieSvg.classList.toggle("dim", i !== null);
            marks.forEach((m) => m.classList.toggle("on", i !== null && m.dataset.i === String(i)));
          };
          marks.forEach((m) => {
            ["pointerenter", "focus"].forEach((ev) => m.addEventListener(ev, () => light(m.dataset.i)));
            ["pointerleave", "blur"].forEach((ev) => m.addEventListener(ev, () => light(null)));
          });
        }

        /* ---------- faq accordion ---------- */
        $$(".faq-q").forEach((btn) =>
          btn.addEventListener("click", () => {
            const open = btn.getAttribute("aria-expanded") === "true";
            $$(".faq-q").forEach((b) => b.setAttribute("aria-expanded", "false"));
            btn.setAttribute("aria-expanded", String(!open));
          })
        );

        /* ---------- contact form ---------- */
        const FORM = C.contactSection.form, MAIL = FORM.mail;
        const form = $("#contactForm"), msg = $("#formMsg"), submitBtn = $("button[type=submit]", form);
        const emailRe = new RegExp(FORM.emailPattern);
        const submitLabel = submitBtn.textContent;

        /* build the email that opens in the visitor's mail app */
        const fill = (s, data) => fmt(s).replace(/\{(\w+)\}/g, (m, k) => (data[k] !== undefined ? data[k] : m));
        const buildMail = (data) => {
          const val = (k) => String(data[k] || "").trim() || "-";
          const rule = "--------------------";
          const lines = [fill(MAIL.greeting, data), "", fill(MAIL.intro, data), "", rule];
          FORM.fields.filter((f) => f.name !== MAIL.messageField).forEach((f) => lines.push(f.label + ": " + val(f.name)));
          lines.push(rule, "", MAIL.messageHeading, val(MAIL.messageField).replace(/\r?\n/g, "\r\n"), "", MAIL.closing, String(data[MAIL.nameField] || "").trim());
          return { subject: fill(MAIL.subject, data), body: lines.join("\r\n") };
        };
        const mailtoHref = (data) => {
          const m = buildMail(data);
          let href = "mailto:" + FORM.recipient + "?subject=" + encodeURIComponent(m.subject) + "&body=" + encodeURIComponent(m.body);
          if (href.length > 1900) { /* very long messages break some mail apps */
            let b = m.body;
            while (href.length > 1900 && b.length > 50) { b = b.slice(0, Math.floor(b.length * 0.9)); href = "mailto:" + FORM.recipient + "?subject=" + encodeURIComponent(m.subject) + "&body=" + encodeURIComponent(b + "..."); }
          }
          return href;
        };
        const gmailHref = (data) => {
          const m = buildMail(data);
          return FORM.gmailUrl + "&to=" + encodeURIComponent(FORM.recipient) + "&su=" + encodeURIComponent(m.subject) + "&body=" + encodeURIComponent(m.body);
        };
        /* opens the mail app; if nothing opens (no app set up), goes to Gmail on the web instead. Must run straight from a click. */
        const openMail = (data) => {
          let left = false;
          const mark = () => { left = true; };
          const onVis = () => { if (document.hidden) mark(); };
          window.addEventListener("blur", mark);
          window.addEventListener("pagehide", mark);
          document.addEventListener("visibilitychange", onVis);
          const a = document.createElement("a");
          a.href = mailtoHref(data);
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => {
            window.removeEventListener("blur", mark);
            window.removeEventListener("pagehide", mark);
            document.removeEventListener("visibilitychange", onVis);
            if (left) return; /* mail app opened */
            window.open(gmailHref(data), "_blank", "noopener"); /* Gmail in a new tab */
          }, 1500);
        };
        const showLinks = (text) => { msg.textContent = text; };

        /* send through the online service; throws on any failure */
        const sendOnline = async (data) => {
          const extra = Object.fromEntries(Object.entries(FORM.extra || {}).map(([k, v]) => [k, fmt(v)]));
          const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), FORM.timeoutMs);
          try {
            const r = await fetch(FORM.endpoint.replace("{recipient}", FORM.recipient), {
              method: "POST",
              headers: { "Content-Type": "application/json", Accept: "application/json" },
              body: JSON.stringify({ ...extra, ...data }),
              signal: ctl.signal,
            });
            const j = await r.json().catch(() => ({}));
            if (!r.ok || j.success === false || j.success === "false") throw new Error(j.message || r.status);
          } finally { clearTimeout(timer); }
        };

        let armed = false; /* true after online sending failed: the button now opens the mail app */
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          let ok = true;
          FORM.fields.filter((f) => f.required).forEach((f) => {
            const el = form.elements[f.name], v = el.value.trim();
            const bad = !v || (f.type === "email" && !emailRe.test(v));
            el.classList.toggle("invalid", bad);
            if (bad) ok = false;
          });
          if (!ok) { msg.textContent = FORM.errors.invalid; return; }

          const data = Object.fromEntries(new FormData(form));
          if (armed) { showLinks(FORM.opening, data); openMail(data); return; }
          const done = () => { submitBtn.disabled = false; submitBtn.textContent = armed ? FORM.emailInstead : submitLabel; };
          submitBtn.disabled = true;
          submitBtn.textContent = FORM.sending;
          msg.textContent = "";

          /* 1. try online (not possible when the page is opened as a local file) */
          if (FORM.mode !== "mailto" && FORM.endpoint && location.protocol !== "file:") {
            try {
              await sendOnline(data);
              done();
              msg.textContent = FORM.success;
              form.reset();
              return;
            } catch (err) { console.warn("Online send failed:", err); }
          }

          /* 2. online-only mode: show manual options */
          if (FORM.mode === "service" && FORM.endpoint) {
            done();
            showLinks(FORM.errors.send, data);
            return;
          }

          /* 3a. mailto mode: still inside the click, so the mail app can open straight away */
          if (FORM.mode === "mailto" || !FORM.endpoint || location.protocol === "file:") {
            done();
            showLinks(FORM.opening, data);
            openMail(data);
            return;
          }

          /* 3b. online sending failed: Safari blocks auto-opening mail now, so turn the button into "Email us instead" */
          done();
          armed = true;
          submitBtn.textContent = FORM.emailInstead;
          showLinks(FORM.fallback, data);
        });
      })();
    </script>
  </body>
</html>
